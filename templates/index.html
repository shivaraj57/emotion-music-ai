<!DOCTYPE html>
<html>

<head>

    <title>Emotion Music AI</title>

    <style>

        body{
            background:#0f0f0f;
            color:white;
            text-align:center;
            font-family:Arial;
        }

        h1{
            color:cyan;
            margin-top:40px;
            font-size:60px;
        }

        .box{

            width:80%;
            margin:auto;
            background:#1e1e1e;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 0px 20px cyan;
            margin-top:40px;

        }

        input{

            margin-top:20px;
            font-size:20px;
            color:white;

        }

        button{

            margin-top:20px;
            padding:15px 30px;
            background:cyan;
            border:none;
            border-radius:10px;
            font-size:20px;
            cursor:pointer;

        }

        img{

            width:400px;
            border-radius:20px;
            margin-top:30px;
            border:5px solid cyan;

        }

    </style>

</head>

<body>

    <h1>Emotion Music AI</h1>

    <div class="box">

        <h2>Upload Image</h2>

        <form method="POST" enctype="multipart/form-data">

            <input type="file" name="image">

            <br>

            <button type="submit">
                Upload
            </button>

        </form>

        {% if filename %}

            <img src="{{ url_for('static', filename='uploads/' + filename) }}">

        {% endif %}

    </div>

</body>

</html>

<!DOCTYPE html>
<html>

<head>

    <title>Emotion Music AI</title>

    <style>

        body{
            background:#0f0f0f;
            color:white;
            text-align:center;
            font-family:Arial;
        }

        h1{
            color:cyan;
            margin-top:30px;
            font-size:55px;
        }

        video{

            width:700px;
            border-radius:20px;
            border:5px solid cyan;
            margin-top:30px;

        }

        button{

            margin-top:30px;
            padding:15px 30px;
            font-size:22px;
            background:cyan;
            border:none;
            border-radius:10px;
            cursor:pointer;

        }

        h2{

            margin-top:30px;
            color:yellow;
            font-size:40px;

        }

    </style>

</head>

<body>

    <h1>Emotion Music AI</h1>

    <video id="camera" autoplay></video>

    <br>

    <button onclick="detectEmotion()">
        Detect Emotion
    </button>

    <h2 id="result">
        Emotion Will Appear Here
    </h2>

    <script>

        navigator.mediaDevices.getUserMedia({
            video:true
        })

        .then(function(stream){

            document.getElementById("camera").srcObject = stream;

        });

        function detectEmotion(){

            fetch('/detect', {
                method:'POST'
            })

            .then(response => response.json())

            .then(data => {

                document.getElementById("result").innerHTML =
                "Detected Emotion : " + data.emotion;

            });

        }

    </script>

</body>

</html>

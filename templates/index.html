<!DOCTYPE html>
<html>

<head>

    <title>Emotion Music AI</title>

    <style>

        body{
            margin:0;
            background:black;
            font-family:Arial;
            color:white;
            text-align:center;
        }

        h1{

            color:cyan;
            font-size:70px;
            margin-top:20px;
            text-shadow:0px 0px 20px cyan;

        }

        .main{

            display:flex;
            justify-content:center;
            align-items:flex-start;
            gap:40px;
            margin-top:30px;
            flex-wrap:wrap;

        }

        .camera-box{

            background:#111;
            padding:20px;
            border-radius:20px;
            box-shadow:0px 0px 20px cyan;

        }

        video{

            width:700px;
            border-radius:20px;
            border:4px solid cyan;

        }

        .side-panel{

            width:320px;
            background:#111;
            border-radius:20px;
            padding:30px;
            box-shadow:0px 0px 20px cyan;

        }

        .emotion{

            font-size:60px;
            color:yellow;
            margin-top:20px;

        }

        button{

            margin-top:25px;
            padding:15px 35px;
            font-size:22px;
            border:none;
            border-radius:12px;
            background:cyan;
            cursor:pointer;

        }

        .wave{

            width:100%;
            height:120px;
            margin-top:30px;

        }

        .wave svg{

            width:100%;
            height:100%;

        }

        .tip{

            margin-top:20px;
            font-size:20px;
            color:#aaa;

        }

        .song{

            margin-top:20px;
            font-size:28px;
            color:lime;

        }

        a{

            display:block;
            margin-top:15px;
            color:cyan;
            font-size:22px;
            text-decoration:none;

        }

    </style>

</head>

<body>

    <h1>Emotion Music AI</h1>

    <div class="main">

        <div class="camera-box">

            <video id="camera" autoplay></video>

            <br>

            <button onclick="detectEmotion()">
                Capture & Detect
            </button>

            <div class="tip">
                Look at camera for best result
            </div>

        </div>

        <div class="side-panel">

            <h2>Detected Emotion</h2>

            <div class="emotion" id="result">

                😊

            </div>

            <h2 style="margin-top:40px;">
                Recommended Song
            </h2>

            <div class="song" id="song">

                Song will appear here

            </div>

            <a id="youtube" target="_blank">
                Open YouTube
            </a>

            <a id="spotify" target="_blank">
                Open Spotify
            </a>

            <h2 style="margin-top:40px;">
                Mood Analysis
            </h2>

            <div class="wave">

                <svg viewBox="0 0 500 150">

                    <path
                        d="M0 80 
                           Q 25 20 50 80
                           T 100 80
                           T 150 80
                           T 200 80
                           T 250 80
                           T 300 80
                           T 350 80
                           T 400 80
                           T 450 80
                           T 500 80"
                        stroke="cyan"
                        fill="transparent"
                        stroke-width="5">

                        <animate
                            attributeName="d"
                            dur="2s"
                            repeatCount="indefinite"

                            values="
                            M0 80 Q25 20 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80;

                            M0 80 Q25 120 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80;

                            M0 80 Q25 20 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80
                            " />

                    </path>

                </svg>

            </div>

        </div>

    </div>

    <script>

        navigator.mediaDevices.getUserMedia({
            video:true
        })

        .then(function(stream){

            document.getElementById("camera").srcObject = stream;

        });

        function detectEmotion(){

            fetch('/detect', {

                method:'POST'

            })

            .then(response => response.json())

            .then(data => {

                document.getElementById("result").innerHTML =
                data.emotion;

                document.getElementById("song").innerHTML =
                data.song;

                document.getElementById("youtube").href =
                data.youtube;

                document.getElementById("spotify").href =
                data.spotify;

            });

        }

    </script>

</body>

</html>

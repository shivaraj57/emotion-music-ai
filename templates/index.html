<!DOCTYPE html>
<html>

<head>

    <title>Emotion Music AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:
            radial-gradient(circle at top,
            #111,
            black);

            font-family:Arial;
            color:white;
            overflow-x:hidden;
            min-height:100vh;

        }

        h1{

            text-align:center;
            margin-top:25px;
            font-size:75px;
            color:cyan;
            text-shadow:
            0px 0px 20px cyan,
            0px 0px 40px cyan;

        }

        .main{

            width:95%;
            margin:auto;
            margin-top:30px;

            display:flex;
            justify-content:center;
            gap:40px;
            flex-wrap:wrap;

        }

        .camera-box{

            background:#111;
            border-radius:25px;
            padding:25px;

            box-shadow:
            0px 0px 20px cyan,
            0px 0px 50px rgba(0,255,255,0.3);

        }

        video{

            width:720px;
            border-radius:20px;
            border:4px solid cyan;

        }

        .panel{

            width:350px;

            background:#111;

            border-radius:25px;

            padding:30px;

            box-shadow:
            0px 0px 20px cyan,
            0px 0px 50px rgba(0,255,255,0.3);

        }

        .emotion{

            margin-top:20px;
            font-size:65px;
            color:yellow;
            text-align:center;

        }

        .emoji{

            font-size:80px;
            margin-top:10px;
            text-align:center;

        }

        .song{

            margin-top:30px;
            font-size:28px;
            color:lime;
            text-align:center;

        }

        .buttons{

            margin-top:25px;
            display:flex;
            flex-direction:column;
            gap:15px;

        }

        a{

            text-decoration:none;

        }

        .link-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:15px;

            font-size:22px;

            cursor:pointer;

            background:cyan;

            color:black;

            font-weight:bold;

            transition:0.3s;

        }

        .link-btn:hover{

            transform:scale(1.05);

            background:white;

        }

        .detect-btn{

            margin-top:25px;

            width:100%;

            padding:18px;

            font-size:26px;

            border:none;

            border-radius:15px;

            background:linear-gradient(
            45deg,
            cyan,
            blue
            );

            color:white;

            cursor:pointer;

            font-weight:bold;

            transition:0.3s;

            box-shadow:
            0px 0px 20px cyan;

        }

        .detect-btn:hover{

            transform:scale(1.03);

        }

        .wave{

            margin-top:35px;
            width:100%;
            height:120px;

        }

        .tip{

            margin-top:20px;
            text-align:center;
            color:#aaa;
            font-size:20px;

        }

    </style>

</head>

<body>

    <h1>Emotion Music AI</h1>

    <div class="main">

        <div class="camera-box">

            <video id="camera" autoplay></video>

            <button
                class="detect-btn"
                onclick="detectEmotion()"
            >
                🎵 Capture & Detect
            </button>

            <div class="tip">
                Look at camera and click detect
            </div>

        </div>

        <div class="panel">

            <h2 style="text-align:center;">
                Detected Emotion
            </h2>

            <div
                class="emotion"
                id="emotion"
            >
                Happy
            </div>

            <div
                class="emoji"
                id="emoji"
            >
                😊
            </div>

            <div
                class="song"
                id="song"
            >
                Song will appear here
            </div>

            <div class="buttons">

                <a
                    id="youtube"
                    target="_blank"
                >
                    <button class="link-btn">
                        ▶ Open YouTube
                    </button>
                </a>

                <a
                    id="spotify"
                    target="_blank"
                >
                    <button class="link-btn">
                        🎧 Open Spotify
                    </button>
                </a>

            </div>

            <div class="wave">

                <svg
                    viewBox="0 0 500 150"
                    width="100%"
                    height="100%"
                >

                    <path

                        d="M0 80 
                           Q 25 20 50 80
                           T 100 80
                           T 150 80
                           T 200 80
                           T 250 80
                           T 300 80
                           T 350 80
                           T 400 80
                           T 450 80
                           T 500 80"

                        stroke="cyan"

                        fill="transparent"

                        stroke-width="5"

                    >

                        <animate

                            attributeName="d"

                            dur="2s"

                            repeatCount="indefinite"

                            values="
                            M0 80 Q25 20 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80;

                            M0 80 Q25 120 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80;

                            M0 80 Q25 20 50 80 T100 80 T150 80 T200 80 T250 80 T300 80 T350 80 T400 80 T450 80 T500 80
                            "

                        />

                    </path>

                </svg>

            </div>

        </div>

    </div>

    <script>

        navigator.mediaDevices.getUserMedia({

            video:true

        })

        .then(function(stream){

            document.getElementById(
                "camera"
            ).srcObject = stream;

        });

        function detectEmotion(){

            fetch('/detect', {

                method:'POST'

            })

            .then(response => response.json())

            .then(data => {

                document.getElementById(
                    "emotion"
                ).innerHTML = data.emotion;

                document.getElementById(
                    "emoji"
                ).innerHTML = data.emoji;

                document.getElementById(
                    "song"
                ).innerHTML = data.song;

                document.getElementById(
                    "youtube"
                ).href = data.youtube;

                document.getElementById(
                    "spotify"
                ).href = data.spotify;

            });

        }

    </script>

</body>

</html>

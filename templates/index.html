<!DOCTYPE html>
<html>

<head>

    <title>Emotion Music AI</title>

    <style>

        body{
            background:#0f0f0f;
            color:white;
            text-align:center;
            font-family:Arial;
        }

        h1{
            color:cyan;
            margin-top:40px;
            font-size:50px;
        }

        .box{

            width:70%;
            margin:auto;
            background:#1e1e1e;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 0px 20px cyan;
            margin-top:40px;

        }

        button{

            background:cyan;
            color:black;
            border:none;
            padding:15px 30px;
            font-size:20px;
            border-radius:10px;
            cursor:pointer;
            margin-top:20px;

        }

        button:hover{

            background:white;

        }

        .emotion{

            font-size:30px;
            margin-top:30px;
            color:yellow;

        }

    </style>

</head>

<body>

    <h1>Emotion Music AI</h1>

    <div class="box">

        <h2>AI Music Recommendation System</h2>

        <button>
            Open Webcam
        </button>

        <div class="emotion">

            Emotion Result Will Appear Here

        </div>

    </div>

</body>

</html>
